services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudspend-postgres
    environment:
      POSTGRES_DB: cloudspend
      POSTGRES_USER: cloudspend
      POSTGRES_PASSWORD: cloudspend_dev
    ports:
      - "5432:5432"
    volumes:
      - cloudspend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudspend -d cloudspend"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cloudspend_postgres_data: